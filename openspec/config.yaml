schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  tasks:
    - Create/update unit tests
    - Create e2e test for functionalities that cannot be tested with a unit test
    - |
      Every tasks.md MUST end with a "Quality Gates" task group as the final group.
      This group is mandatory and must always be included exactly as shown below
      (adjust the group number to follow the last implementation group):

      ## N. Quality Gates

      - [ ] N.1 Run `npm run lint` and fix any issues
      - [ ] N.2 Run `npx tsc --noEmit` and fix any type errors
      - [ ] N.3 Run `npm run test` and fix any issues
      - [ ] N.4 Run `npm run test:e2e` and fix any issues
      - [ ] N.5 Run `mcp__jetbrains__get_file_problems` on all created/changed files and fix genuine issues
      - [ ] N.6 Check whether anything learned should update `docs/` or `README.md` and apply changes if needed
