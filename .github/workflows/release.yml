name: Release

# Prerequisites (GitHub repository settings, not managed by this file):
#   - "Allow auto-merge" must be enabled in the repository settings.
#   - Squash merging must be allowed for PRs.
#   - Branch protection on `develop`: require PR and status checks to pass.
#   - Vercel production branch must be set to `develop` (continuous deployment).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create local develop branch
        run: git checkout -B develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Analyze commits and determine bump type
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" --match "newsflash-v*" 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          SUBJECTS=$(git log "$RANGE" --pretty=format:"%s" 2>/dev/null || echo "")

          if [ -z "$SUBJECTS" ]; then
            echo "No commits since last tag. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="none"

          # Check subject lines for breaking change marker (e.g. "feat!: ...")
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE "^[a-z]+(\(.+\))?!:"; then
              BUMP="major"
              break
            fi
          done <<< "$SUBJECTS"

          # Check full commit messages for BREAKING CHANGE footer
          if [ "$BUMP" != "major" ]; then
            FULL_MSGS=$(git log "$RANGE" --pretty=format:"%B" 2>/dev/null || echo "")
            if echo "$FULL_MSGS" | grep -qE "^BREAKING CHANGE:"; then
              BUMP="major"
            fi
          fi

          if [ "$BUMP" != "major" ]; then
            while IFS= read -r msg; do
              if echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
                BUMP="minor"
                break
              fi
            done <<< "$SUBJECTS"
          fi

          if [ "$BUMP" = "none" ]; then
            while IFS= read -r msg; do
              if echo "$msg" | grep -qE "^(fix|perf|refactor)(\(.+\))?:"; then
                BUMP="patch"
                break
              fi
            done <<< "$SUBJECTS"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "No releasable commits. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Determined bump type: $BUMP"

      - name: Install dependencies
        if: steps.bump.outputs.skip != 'true'
        run: npm ci

      - name: Bump version
        if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          npm version ${{ steps.bump.outputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $VERSION"

      - name: Generate CHANGELOG
        if: steps.bump.outputs.skip != 'true'
        run: npx conventional-changelog -n changelog.config.mjs -i CHANGELOG.md -r 1

      - name: Build
        if: steps.bump.outputs.skip != 'true'
        run: npm run build

      - name: Run tests with coverage and JUnit output
        if: steps.bump.outputs.skip != 'true'
        run: npm run test:coverage -- --reporter=junit --outputFile=test-results.xml

      - name: Install Playwright browsers
        if: steps.bump.outputs.skip != 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        if: steps.bump.outputs.skip != 'true'
        run: npm run test:e2e

      - name: Commit version bump and CHANGELOG to release branch
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/v${{ steps.version.outputs.version }}"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin "$BRANCH"

      - name: Create PR to develop with auto-merge
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/v${VERSION}"
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: release v${VERSION}" \
            --body "Automated release PR for v${VERSION}. Merges version bump and CHANGELOG update into develop."
          gh pr merge "$BRANCH" --auto --squash --delete-branch

      - name: Package release artifacts
        if: steps.bump.outputs.skip != 'true'
        run: |
          tar -czf dist.tar.gz dist/
          zip -r coverage-report.zip coverage/
          zip -r playwright-report.zip playwright-report/

      - name: Upload release artifacts
        if: steps.bump.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist.tar.gz
            test-results.xml
            coverage-report.zip
            playwright-report.zip
          retention-days: 1
