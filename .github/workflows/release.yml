name: Release

# Prerequisites (GitHub repository settings, not managed by this file):
#   - Merge commits must be enabled for PRs to master.
#   - Branch protection on `develop`: require PR and status checks to pass.
#   - Vercel production branch must be set to `master`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create local develop branch
        run: git checkout -B develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Analyze commits and determine bump type
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" --match "newsflash-v*" 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          SUBJECTS=$(git log "$RANGE" --pretty=format:"%s" 2>/dev/null || echo "")

          if [ -z "$SUBJECTS" ]; then
            echo "No commits since last tag. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="none"

          # Check subject lines for breaking change marker (e.g. "feat!: ...")
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE "^[a-z]+(\(.+\))?!:"; then
              BUMP="major"
              break
            fi
          done <<< "$SUBJECTS"

          # Check full commit messages for BREAKING CHANGE footer
          if [ "$BUMP" != "major" ]; then
            FULL_MSGS=$(git log "$RANGE" --pretty=format:"%B" 2>/dev/null || echo "")
            if echo "$FULL_MSGS" | grep -qE "^BREAKING CHANGE:"; then
              BUMP="major"
            fi
          fi

          if [ "$BUMP" != "major" ]; then
            while IFS= read -r msg; do
              if echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
                BUMP="minor"
                break
              fi
            done <<< "$SUBJECTS"
          fi

          if [ "$BUMP" = "none" ]; then
            while IFS= read -r msg; do
              if echo "$msg" | grep -qE "^(fix|perf|refactor)(\(.+\))?:"; then
                BUMP="patch"
                break
              fi
            done <<< "$SUBJECTS"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "No releasable commits. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Determined bump type: $BUMP"

      - name: Compute version from last tag
        if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" --match "newsflash-v*" 2>/dev/null || echo "v0.0.0")
          # Strip prefix (v or newsflash-v)
          TAG_VERSION="${LAST_TAG#newsflash-}"
          TAG_VERSION="${TAG_VERSION#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          BUMP="${{ steps.bump.outputs.bump }}"

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $NEW_VERSION (from tag $LAST_TAG, bump $BUMP)"

          if [ "$NEW_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Version already matches package.json. Skipping bump."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        run: npm ci

      - name: Bump version in package.json
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Generate CHANGELOG
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        run: npx conventional-changelog -n changelog.config.mjs -i CHANGELOG.md -r 1

      - name: Commit version bump and CHANGELOG to develop
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin develop

      - name: Create or update release PR
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EXISTING_PR=$(gh pr list --base master --head develop --state open --json number,title --jq '.[0]')

          if [ -z "$EXISTING_PR" ] || [ "$EXISTING_PR" = "null" ]; then
            echo "Creating new release PR..."
            gh pr create \
              --base master \
              --head develop \
              --title "chore: release v${VERSION}" \
              --body "Automated release PR for v${VERSION}. Merge this PR to cut a release."
          else
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_TITLE=$(echo "$EXISTING_PR" | jq -r '.title')
            EXPECTED_TITLE="chore: release v${VERSION}"

            if [ "$PR_TITLE" != "$EXPECTED_TITLE" ]; then
              echo "Updating PR #${PR_NUMBER} title to: ${EXPECTED_TITLE}"
              gh pr edit "$PR_NUMBER" --title "$EXPECTED_TITLE"
            else
              echo "PR #${PR_NUMBER} already has correct title. No update needed."
            fi
          fi
