name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      - name: Run release-please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Run tests with coverage and JUnit output
        if: ${{ steps.release.outputs.release_created }}
        run: npm run test:coverage -- --reporter=junit --outputFile=test-results.xml

#      - name: Install Playwright browsers
#        if: ${{ steps.release.outputs.release_created }}
#        run: npx playwright install --with-deps

#      - name: Run Playwright E2E tests
#        if: ${{ steps.release.outputs.release_created }}
#        run: npm run test:e2e

      - name: Package dist output
        if: ${{ steps.release.outputs.release_created }}
        run: tar -czf dist.tar.gz dist/

      - name: Package coverage report
        if: ${{ steps.release.outputs.release_created }}
        run: zip -r coverage-report.zip coverage/

      - name: Package Playwright report
        if: ${{ steps.release.outputs.release_created }}
        run: zip -r playwright-report.zip playwright-report/

      - name: Attach release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} \
            dist.tar.gz \
            test-results.xml \
            coverage-report.zip
#            coverage-report.zip \
#            playwright-report.zip
