name: Release

# Prerequisites (GitHub repository settings, not managed by this file):
#   - Merge commits must be enabled for PRs to master.
#   - Branch protection on `develop`: require PR and status checks to pass.
#   - Vercel production branch must be set to `master`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create local develop branch
        run: git checkout -B develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Analyze commits and determine bump type
        id: bump
        run: |
          # Use sorted tag list instead of git describe, because tags live on
          # master merge commits which are not ancestors of develop.
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            # The tag lives on a master merge commit, not in develop's ancestry.
            # Use merge-base to find the common ancestor and scope the range correctly.
            MERGE_BASE=$(git merge-base "$LAST_TAG" HEAD 2>/dev/null || echo "")
            if [ -z "$MERGE_BASE" ]; then
              RANGE="HEAD"
            else
              RANGE="${MERGE_BASE}..HEAD"
            fi
          fi

          SUBJECTS=$(git log "$RANGE" --pretty=format:"%s" 2>/dev/null || echo "")

          if [ -z "$SUBJECTS" ]; then
            echo "No commits since last tag. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="none"

          # Check subject lines for breaking change marker (e.g. "feat!: ...")
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE "^[a-z]+(\(.+\))?!:"; then
              BUMP="major"
              break
            fi
          done <<< "$SUBJECTS"

          # Check full commit messages for BREAKING CHANGE footer
          if [ "$BUMP" != "major" ]; then
            FULL_MSGS=$(git log "$RANGE" --pretty=format:"%B" 2>/dev/null || echo "")
            if echo "$FULL_MSGS" | grep -qE "^BREAKING CHANGE:"; then
              BUMP="major"
            fi
          fi

          if [ "$BUMP" != "major" ]; then
            while IFS= read -r msg; do
              if echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
                BUMP="minor"
                break
              fi
            done <<< "$SUBJECTS"
          fi

          if [ "$BUMP" = "none" ]; then
            while IFS= read -r msg; do
              if echo "$msg" | grep -qE "^(fix|perf|refactor)(\(.+\))?:"; then
                BUMP="patch"
                break
              fi
            done <<< "$SUBJECTS"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "No releasable commits. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Determined bump type: $BUMP"

      - name: Compute version from last tag
        if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          LAST_TAG="${LAST_TAG:-v0.0.0}"
          TAG_VERSION="${LAST_TAG#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          BUMP="${{ steps.bump.outputs.bump }}"

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $NEW_VERSION (from tag $LAST_TAG, bump $BUMP)"

          if [ "$NEW_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Version already matches package.json. Skipping bump."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        run: npm ci

      - name: Bump version in package.json
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Generate CHANGELOG
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        run: npx conventional-changelog -n changelog.config.mjs -i CHANGELOG.md -r 1

      - name: Commit version bump and CHANGELOG to a bump branch
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fast-forward to the current remote tip before committing.
          git fetch origin develop
          git merge --ff-only origin/develop

          BUMP_BRANCH="chore/release-v${{ steps.version.outputs.version }}"
          git checkout -b "$BUMP_BRANCH"

          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push --force-with-lease origin "$BUMP_BRANCH"

          echo "bump_branch=$BUMP_BRANCH" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Create and auto-merge version bump PR
        if: steps.bump.outputs.skip != 'true' && steps.version.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUMP_BRANCH="${{ steps.commit.outputs.bump_branch }}"

          # Check for existing bump PR (open or closed) to avoid duplicate creation failures
          EXISTING_BUMP_PR=$(gh pr list --base develop --head "$BUMP_BRANCH" --state all --json url,state --jq '.[0]')

          if [ -n "$EXISTING_BUMP_PR" ] && [ "$EXISTING_BUMP_PR" != "null" ]; then
            PR_URL=$(echo "$EXISTING_BUMP_PR" | jq -r '.url')
            PR_STATE=$(echo "$EXISTING_BUMP_PR" | jq -r '.state')
            echo "Found existing bump PR ($PR_STATE): $PR_URL"

            if [ "$PR_STATE" = "CLOSED" ]; then
              gh pr reopen "$PR_URL"
            fi
          else
            PR_URL=$(gh pr create \
              --base develop \
              --head "$BUMP_BRANCH" \
              --title "chore: bump version to v${VERSION}" \
              --body "Automated version bump to v${VERSION}. This PR will be auto-merged.")
          fi

          if ! gh pr merge "$PR_URL" --auto --squash --delete-branch; then
            echo "::warning::Auto-merge unavailable. Attempting immediate merge."
            gh pr merge "$PR_URL" --squash --delete-branch || echo "::warning::Bump PR could not be merged automatically. Manual merge required: $PR_URL"
          fi

      - name: Create or update release PR
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EXISTING_PR=$(gh pr list --base master --head develop --state open --json number,title --jq '.[0]')

          if [ -z "$EXISTING_PR" ] || [ "$EXISTING_PR" = "null" ]; then
            echo "Creating new release PR..."
            gh pr create \
              --base master \
              --head develop \
              --title "chore: release v${VERSION}" \
              --body "Automated release PR for v${VERSION}. Merge this PR to cut a release."
          else
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_TITLE=$(echo "$EXISTING_PR" | jq -r '.title')
            EXPECTED_TITLE="chore: release v${VERSION}"

            if [ "$PR_TITLE" != "$EXPECTED_TITLE" ]; then
              echo "Updating PR #${PR_NUMBER} title to: ${EXPECTED_TITLE}"
              gh pr edit "$PR_NUMBER" --title "$EXPECTED_TITLE"
            else
              echo "PR #${PR_NUMBER} already has correct title. No update needed."
            fi
          fi
