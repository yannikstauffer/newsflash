name: E2E Live Feed Tests

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:

jobs:
  e2e-live:
    name: Live Connector Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run live connector tests
        run: npx playwright test --project=chromium tests-e2e/connectors.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
