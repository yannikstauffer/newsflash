version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"

    open-pull-requests-limit: 10

    commit-message:
      prefix: "deps"
      include: "scope"

    labels:
      - "dependencies"

    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"

      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "jsdom"

      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@stylistic/*"

      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"

      typescript:
        patterns:
          - "typescript"
          - "@types/*"

    ignore:
      # avoid noisy major upgrades; review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    versioning-strategy: increase
